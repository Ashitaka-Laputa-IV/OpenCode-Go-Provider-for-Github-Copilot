name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package -- --out opencode-go-provider-for-copilot.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-go-provider-for-copilot-vsix
          path: opencode-go-provider-for-copilot.vsix
          if-no-files-found: error
